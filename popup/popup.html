<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading Time</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Reading Time</h1>

      <div class="settings-section">
        <label for="wpmInput">Words Per Minute:</label>
        <div class="control-wrapper">
          <input type="number" id="wpmInput" min="50" max="1000" step="10" />
          <button id="resetWpmBtn" class="btn-icon" title="Reset to default">
            ↻
          </button>
        </div>
      </div>

      <button id="analyzeBtn" class="btn">Analyze Page</button>

      <div id="stats">
        <div class="item">
          <span class="label">Words:</span>
          <span id="wordCount" class="value">-</span>
        </div>
        <div class="item">
          <span class="label">Reading Time:</span>
          <span id="readingTime" class="value">-</span>
        </div>
        <div class="item">
          <span class="label">WPM:</span>
          <span id="wpmDisplay" class="value">-</span>
        </div>
      </div>

      <div id="error"></div>

      <div class="debug-section">
        <label class="debug-label">
          <input type="checkbox" id="debugMode" />
          <span>Debug mode</span>
        </label>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
